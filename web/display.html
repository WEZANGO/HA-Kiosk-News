<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiosk News</title>
<style>
:root{--bg:#0b1222;--fg:#f8fafc;--muted:#94a3b8;--accent:#38bdf8}
body.light{--bg:#f8fafc;--fg:#0f172a;--muted:#64748b;--accent:#0284c7}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
#media{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s ease}
#media.hidden{opacity:0}
#media-dim{position:absolute;inset:0;background:rgba(3,7,18,var(--dim,.35))}
body.light #media-dim{background:rgba(248,250,252,var(--dim,.25))}
/* Vignette: single full-viewport farthest-corner gradient, no boxes.
   Light mode fades to white instead of black (matches text-side shadow). */
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse farthest-corner at center,transparent 40%,rgba(0,0,0,var(--vig,.5)) 100%)}
body.light #vignette{background:radial-gradient(ellipse farthest-corner at center,transparent 40%,rgba(248,250,252,var(--vig,.5)) 100%)}
/* Text-side shadow: gradient rising from the edge the text sits against,
   fading to transparent just past the far side of the text block. */
#textshadow{position:absolute;inset:0;pointer-events:none;z-index:4;display:none;background:linear-gradient(var(--ts-dir,to top),rgba(0,0,0,var(--vig,.5)) 0%,rgba(0,0,0,0) var(--ts-extent,55%))}
#textshadow.on{display:block}
/* Layout modes */
#stage[data-layout="full"] #media{position:absolute;inset:0}
#stage[data-layout="top"] #media{position:absolute;inset:0 0 50% 0}
#stage[data-layout="bottom"] #media{position:absolute;inset:50% 0 0 0}
#stage[data-layout="left"] #media{position:absolute;inset:0 50% 0 0}
#stage[data-layout="right"] #media{position:absolute;inset:0 0 0 50%}
#text{position:absolute;z-index:5}
#stage[data-layout="full"] #text{inset:auto 6vw 8vh 6vw}
#stage[data-layout="top"] #text{inset:50% 5vw 0 5vw;display:flex;flex-direction:column;justify-content:center}
#stage[data-layout="bottom"] #text{inset:0 5vw 50% 5vw;display:flex;flex-direction:column;justify-content:center}
#stage[data-layout="left"] #text{inset:0 5vw 0 calc(50% + 4vw);display:flex;flex-direction:column;justify-content:center}
#stage[data-layout="right"] #text{inset:0 calc(50% + 4vw) 0 5vw;display:flex;flex-direction:column;justify-content:center}
#headline{font-weight:700;line-height:1.15;letter-spacing:-.01em}
body[data-textsize="small"] #headline{font-size:3.2vh}
body[data-textsize="medium"] #headline{font-size:4.6vh}
body[data-textsize="large"] #headline{font-size:6.2vh}
body[data-textsize="xlarge"] #headline{font-size:8vh}
#brief{margin-top:2vh;color:var(--muted);line-height:1.4;max-height:38vh;overflow:hidden}
body[data-textsize="small"] #brief{font-size:2.2vh}
body[data-textsize="medium"] #brief{font-size:2.8vh}
body[data-textsize="large"] #brief{font-size:3.4vh}
body[data-textsize="xlarge"] #brief{font-size:4.2vh}
#meta{margin-top:2.5vh;display:flex;gap:1.5vw;align-items:center;color:var(--muted);font-size:2.2vh;text-transform:uppercase;letter-spacing:.06em}
#meta .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
/* Title banner: floating text, no box */
#banner{position:absolute;left:0;right:0;z-index:6;text-align:center;font-weight:700;color:var(--fg);text-shadow:0 2px 12px rgba(0,0,0,.6)}
body[data-titlepos="top"] #banner{top:4vh}
body[data-titlepos="bottom"] #banner{bottom:4vh}
body[data-titlesize="small"] #banner{font-size:3vh}
body[data-titlesize="medium"] #banner{font-size:4.2vh}
body[data-titlesize="large"] #banner{font-size:5.6vh}
body[data-titlefont="serif"] #banner{font-family:Georgia,serif}
body[data-titlefont="mono"] #banner{font-family:ui-monospace,Menlo,monospace}
#progress{position:absolute;left:0;bottom:0;height:4px;background:var(--progress-color,var(--accent));width:0;z-index:7}
#progress.on{animation:grow linear}
body.paused #progress.on{animation-play-state:paused}
@keyframes grow{from{width:0}to{width:100%}}
/* Paused indicator: small badge in the corner, visible only while paused. */
#pausebadge{position:absolute;top:2vh;right:2vw;z-index:8;display:none;align-items:center;gap:1vw;background:rgba(0,0,0,.55);color:#f8fafc;padding:1vh 1.6vw;border-radius:999px;font-size:2vh;letter-spacing:.08em;text-transform:uppercase}
body.light #pausebadge{background:rgba(248,250,252,.75);color:#0f172a}
body.paused #pausebadge{display:flex}
#pausebadge svg{width:2.4vh;height:2.4vh;fill:currentColor}
/* Errors */
#errors{position:absolute;top:2vh;right:2vw;z-index:8;color:#fca5a5;font-size:1.8vh;max-width:40vw;text-align:right;text-shadow:0 1px 6px rgba(0,0,0,.6)}
body[data-compact="true"] #headline{font-size:4vh}
body[data-compact="true"] #brief{font-size:2.4vh;max-height:22vh}
</style>
</head>
<body>
<div id="stage">
  <div id="media" class="hidden"><div id="media-dim"></div></div>
  <div id="vignette"></div>
  <div id="textshadow"></div>
  <div id="banner"></div>
  <div id="text">
    <div id="meta"><span id="meta-source"></span><span class="dot"></span><span id="meta-date"></span></div>
    <div id="headline"></div>
    <div id="brief"></div>
  </div>
  <div id="progress"></div>
  <div id="pausebadge"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Paused</div>
  <div id="errors"></div>
</div>
<script>
const cfg = window.KIOSK_NEWS_CONFIG || {};
const COMPACT = window.KIOSK_NEWS_COMPACT || false;
const stories = Array.isArray(cfg.stories) ? cfg.stories : [];
if (String(cfg.shuffle) === 'true' && stories.length > 1) {
  // Fisher–Yates on a copy; server order is untouched.
  for (let i = stories.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [stories[i], stories[j]] = [stories[j], stories[i]];
  }
}
const SWIPE_ENABLED = String(cfg.swipeNavigation) !== 'false';
const errors = Array.isArray(cfg.errors) ? cfg.errors : [];

const stage = document.querySelector('#stage');
const media = document.querySelector('#media');
const headline = document.querySelector('#headline');
const brief = document.querySelector('#brief');
const metaSource = document.querySelector('#meta-source');
const metaDate = document.querySelector('#meta-date');
const banner = document.querySelector('#banner');
const progress = document.querySelector('#progress');
const errorsEl = document.querySelector('#errors');

document.body.dataset.textsize = cfg.textSize || 'large';
document.body.dataset.titlepos = cfg.titlePosition || 'top';
document.body.dataset.titlesize = cfg.titleSize || 'medium';
document.body.dataset.titlefont = cfg.titleFont || 'system';
document.body.dataset.compact = String(COMPACT);
if ((cfg.background || 'dark') === 'light') document.body.classList.add('light');
// Shadow: 'vignette' (whole-screen edges) or 'edge' (behind title/text only) —
// never both. shadowOpacity (1-10) drives whichever is active.
const SHADOW_STYLE = ['vignette', 'edge'].includes(cfg.shadowStyle) ? cfg.shadowStyle : (cfg.shadowStyle === 'off' ? 'off' : 'vignette');
const SHADOW_VIG = String((parseInt(cfg.shadowOpacity ?? cfg.vignetteOpacity ?? '5', 10) || 5) / 10);
document.documentElement.style.setProperty('--vig', SHADOW_STYLE === 'vignette' ? SHADOW_VIG : '0');
const textShadowEl = document.querySelector('#textshadow');
const stageEl = stage;
function contentRect(el) {
  // The flex containers stretch to their half of the stage; measure the
  // actual rendered children so the shadow follows the text, not the box.
  const kids = [...el.children].filter(k => k.offsetHeight > 0);
  if (!kids.length) return null;
  const r = kids[0].getBoundingClientRect();
  const rect = { top: r.top, bottom: r.bottom, left: r.left, right: r.right };
  for (const k of kids.slice(1)) {
    const kr = k.getBoundingClientRect();
    rect.top = Math.min(rect.top, kr.top); rect.bottom = Math.max(rect.bottom, kr.bottom);
    rect.left = Math.min(rect.left, kr.left); rect.right = Math.max(rect.right, kr.right);
  }
  return rect;
}
function edgeFor(rect) {
  // Which stage edge is this element anchored to, and how deep does it reach?
  const s = stageEl.getBoundingClientRect();
  const w = rect.right - rect.left, h = rect.bottom - rect.top;
  // A block spanning most of the stage's width is anchored top/bottom, not
  // left/right (its side gaps are just margin) — and vice versa.
  const cands = [];
  if (w <= s.width * 0.6) cands.push(
    { edge: 'left', d: rect.left - s.left, axis: s.width },
    { edge: 'right', d: s.right - rect.right, axis: s.width });
  if (h <= s.height * 0.6) cands.push(
    { edge: 'top', d: rect.top - s.top, axis: s.height },
    { edge: 'bottom', d: s.bottom - rect.bottom, axis: s.height });
  if (!cands.length) return null;
  cands.sort((a, b) => a.d - b.d);
  const near = cands[0];
  const dirMap = { top: 'to bottom', bottom: 'to top', left: 'to right', right: 'to left' };
  // Gradient runs from the anchored edge to just past the element's far side.
  const depth = (near.edge === 'top' || near.edge === 'bottom')
    ? (near.edge === 'top' ? rect.bottom - s.top : s.bottom - rect.top)
    : (near.edge === 'left' ? rect.right - s.left : s.right - rect.left);
  return { dir: dirMap[near.edge], extent: Math.min(100, (depth / near.axis) * 100 + 6) };
}
function updateTextShadow() {
  if (SHADOW_STYLE !== 'edge') { textShadowEl.classList.remove('on'); return; }
  const layers = [];
  if (banner.textContent.trim()) { const l = edgeFor(banner.getBoundingClientRect()); if (l) layers.push(l); }
  const textRect = contentRect(document.querySelector('#text'));
  if (textRect && textRect.bottom > textRect.top) { const l = edgeFor(textRect); if (l) layers.push(l); }
  if (!layers.length) { textShadowEl.classList.remove('on'); return; }
  // If title and text sit on the same edge, one deeper gradient covers both —
  // never stack two gradients on the same edge (that doubles the darkness).
  const byEdge = new Map();
  for (const l of layers) {
    const key = l.dir;
    if (!byEdge.has(key) || byEdge.get(key).extent < l.extent) byEdge.set(key, l);
  }
  // Light mode: soft white glow instead of black shadow, so the text stays
  // readable over bright imagery without a dark veil.
  const rgb = document.body.classList.contains('light') ? '255,255,255' : '0,0,0';
  const vig = SHADOW_VIG;
  textShadowEl.style.background = [...byEdge.values()].map(l =>
    `linear-gradient(${l.dir},rgba(${rgb},${vig}) 0%,rgba(${rgb},0) ${l.extent.toFixed(1)}%)`).join(',');
  textShadowEl.classList.add('on');
}
window.addEventListener('resize', () => setTimeout(updateTextShadow, 50));
if (cfg.progressColor) document.documentElement.style.setProperty('--progress-color', cfg.progressColor);
banner.textContent = cfg.title || '';

if (errors.length) {
  errorsEl.textContent = errors.join(' · ');
}

// Text mode: 'title' shows only the headline; 'brief' shows headline + summary.
const TEXT_MODE = cfg.textContent === 'brief' ? 'brief' : 'title';
brief.style.display = TEXT_MODE === 'brief' ? '' : 'none';

// imagePosition: 'full' = image behind text; others = image half, text other half.
const LAYOUT = ['top', 'bottom', 'left', 'right'].includes(cfg.imagePosition) ? cfg.imagePosition : 'full';
stage.dataset.layout = COMPACT && LAYOUT === 'full' ? 'full' : LAYOUT;
stage.dataset.compact = String(COMPACT);
// Readability dim: only in vignette mode (edge mode's gradient already sits
// behind the text; an extra full-image veil would look like a black overlay).
document.documentElement.style.setProperty('--dim', (LAYOUT === 'full' && SHADOW_STYLE === 'vignette') ? SHADOW_VIG : '0');

const showSource = cfg.showSource !== 'false';
const showDate = cfg.showDate !== 'false';
metaSource.style.display = showSource ? '' : 'none';
metaDate.style.display = showDate ? '' : 'none';

function preload(url) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = url;
    setTimeout(() => resolve(false), 8000);
  });
}

// Cache in-flight/completed preloads so each image is fetched once; the
// pre-warm below means the await in show() resolves instantly by the time
// a story is displayed, so text and image swap in the same frame.
const imageCache = new Map();
function preloadCached(url) {
  if (!imageCache.has(url)) imageCache.set(url, preload(url));
  return imageCache.get(url);
}
// Pre-warm the next story's image while the current one is on screen.
function prewarmNext() {
  if (stories.length < 2) return;
  const next = stories[(index + 1) % stories.length];
  if (next && next.image) preloadCached(next.image);
}

function formatDate(value) {
  const d = new Date(value);
  if (isNaN(d)) return '';
  return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

let index = -1;
const seconds = Math.max(3, parseInt(cfg.storySeconds || '15', 10) || 15);

let showTimer = null;
let timerDue = 0;  // absolute due time of the pending showTimer

// Tap-to-pause: freeze story advance and the progress bar mid-fill; a second
// tap resumes with the remaining time. Swipe navigation stays active.
let paused = false;
let remainingMs = 0;

function pauseStory() {
  if (paused || !showTimer) return;
  remainingMs = Math.max(0, timerDue - Date.now());
  clearTimeout(showTimer); showTimer = null;
  paused = true;
  document.body.classList.add('paused');
}

function resumeStory() {
  if (!paused) return;
  paused = false;
  document.body.classList.remove('paused');
  // The CSS progress animation was frozen mid-fill by animation-play-state,
  // so it simply continues; only the story timer needs restarting.
  const left = remainingMs > 0 ? remainingMs : seconds * 1000;
  showTimer = setTimeout(() => show(), left);
  timerDue = Date.now() + left;
}

async function show(next) {
  if (showTimer) { clearTimeout(showTimer); showTimer = null; }
  index = (next !== undefined) ? next : (index + 1) % Math.max(stories.length, 1);
  if (index < 0) index = stories.length - 1;
  const story = stories[index];
  if (!story) return;
  // Wait for the image first (usually instant thanks to prewarmNext), then
  // swap text and image in the same synchronous block so they always change
  // together instead of text leading a slow image fetch.
  let ok = false;
  if (story.image) ok = await preloadCached(story.image);
  headline.textContent = story.title || '';
  brief.textContent = TEXT_MODE === 'brief' ? (story.summary || '') : '';
  metaSource.textContent = showSource ? (story.source || '') : '';
  metaDate.textContent = showDate ? formatDate(story.date) : '';
  // Show image only when one loads; otherwise fall back to flat background.
  if (ok) {
    media.style.backgroundImage = `url("${story.image.replace(/"/g, '%22')}")`;
    media.classList.remove('hidden');
  } else {
    media.style.backgroundImage = '';
    media.classList.add('hidden');
  }
  // Text-side shadow: re-measure after this story's text is in place. Small
  // delay so layout/fonts settle; rAF alone doesn't fire in background tabs.
  setTimeout(updateTextShadow, 50);
  // Progress bar: restart the CSS animation for this story's duration.
  if (cfg.showProgress !== 'false') {
    progress.classList.remove('on');
    void progress.offsetWidth;
    progress.style.animationDuration = seconds + 's';
    progress.classList.add('on');
  }
  // Pre-warm the next story's image while this one is on screen.
  prewarmNext();
  // Advancing to a new story always un-pauses.
  paused = false;
  document.body.classList.remove('paused');
  remainingMs = 0;
  showTimer = setTimeout(() => show(), seconds * 1000);
  timerDue = Date.now() + seconds * 1000;
}

// Swipe navigation: swipe left = next story, swipe right = previous.
// A tap (no horizontal movement) toggles pause.
// Pointer events cover touchscreens and mice alike.
if (SWIPE_ENABLED) {
  let startX = null, startY = null, startT = 0;
  stage.addEventListener('pointerdown', e => { startX = e.clientX; startY = e.clientY; startT = Date.now(); });
  stage.addEventListener('pointerup', e => {
    if (startX === null) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    startX = startY = null;
    if (Date.now() - startT > 1200) return;          // slow press ≠ swipe
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) {
      if (Math.abs(dx) < 20 && Date.now() - startT < 500) {  // a clean tap
        paused ? resumeStory() : pauseStory();
      }
      return;                                        // too small or too vertical
    }
    paused = false;                                  // swiping away clears pause
    document.body.classList.remove('paused');
    remainingMs = 0;
    show(index + (dx < 0 ? 1 : -1));
  });
  stage.addEventListener('pointercancel', () => { startX = startY = null; });
  // Block scroll interference without disabling taps entirely.
  stage.style.touchAction = 'pan-y';
} else {
  // Swipe disabled: taps still toggle pause.
  let downT = 0;
  stage.addEventListener('pointerdown', e => { downT = Date.now(); });
  stage.addEventListener('pointerup', () => {
    if (Date.now() - downT < 500) paused ? resumeStory() : pauseStory();
  });
}

// Page refresh: re-fetch the display page (fresh stories) every refreshInterval.
const refreshMinutes = Math.max(1, parseInt(cfg.refreshInterval || '60', 10) || 60);
setTimeout(() => location.reload(), refreshMinutes * 60 * 1000);

show(0);
</script>
</body>
</html>
